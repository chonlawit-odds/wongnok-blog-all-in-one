# ไม่ใช้ async ใน development แล้ว: async ส่งได้แค่ภายใน process เดียว
# แต่ broadcast ของ comment (broadcast_*_later_to) รันใน bin/jobs คนละ process กับ web
# จึงต้องส่งผ่าน DB (Solid Cable) เหมือน production
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
  writer_batch_size: 4
  writer_batch_delay: 0.001.seconds
